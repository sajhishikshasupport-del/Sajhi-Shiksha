    const short=L(n).split('—')[0].trim();
    html+=`<button class="chip ${active?'active':''}" onclick="goto(${i})"><span class="n">${i+1}</span>${short}</button>`;
    if(i<path.length-1)html+='<span class="sep">\u25B8</span>';
  });
  html+=`<button class="reset" onclick="resetAll()">${T('reset')}</button>`;
  t.innerHTML=html;
  t.scrollLeft=t.scrollWidth;
}

function render(){
  document.documentElement.lang = lang==='hi' ? 'hi' : 'en';
  document.getElementById('langEn').classList.toggle('active', lang==='en');
  document.getElementById('langHi').classList.toggle('active', lang==='hi');
  document.getElementById('langHx').classList.toggle('active', lang==='hx');
  document.getElementById('mainTitle').innerHTML = T('title');
  document.getElementById('mainTagline').textContent = T('tagline');
  document.getElementById('searchBox').placeholder = T('searchPh');
  document.querySelector('[data-i="footNote"]').innerHTML = T('footNote');
  document.getElementById('askTitle').textContent = T('askT');
  document.getElementById('askInput').placeholder = T('askPh');
  document.getElementById('askBtn').textContent = T('askBtn');
  document.getElementById('askNote').textContent = T('askNote');
  document.querySelector('[data-i="reset"]').textContent = T('reset');
  document.querySelector('[data-i="shareBtn"]').textContent = T('shareBtn');

  renderTrail();
  const main=document.getElementById('main');
  const cur=find(path[path.length-1]);
  let html='';

  if(cur.type==='start'){
    html+=`<div class="start-hero">
      <div class="big">10</div>
      <h2>${L(cur)}</h2>
      <p>${D(cur)}</p>
    </div>`;
  }else{
    html+=`<div class="now-card" style="--c:${cur.c}">
      <div class="lvl">${LVL_NAMES()[cur.type]||''}</div>
      <h2>${L(cur)}</h2>
      ${S(cur)?`<div class="nc-sub">${S(cur)}</div>`:''}
      ${FE(cur)?`<div class="nc-fee">${T('feesPref')} ${FE(cur)}</div>`:''}
      <div class="desc">${D(cur)}</div>
    </div>`;
  }

  if(cur.children&&cur.children.length){
    html+=`<div class="arrow-flow"><span>${T('step')} ${path.length}</span></div>`;
    const kids=cur.children;
    const hasStudy=kids.some(k=>k.type!=='job'), hasJob=kids.some(k=>k.type==='job');
    function cardHTML(ch,i){
      const isJob=ch.type==='job';
      const badge=isJob?T('details'):(ch.children&&ch.children[0]&&ch.children[0].type==='job'?T('careers'):T('view'));
      const fshort=s=>s?s.split('·')[0].trim():'';
      const salShort=s=>{const m=(s||'').match(/₹[0-9][^ ·(—]*(?: ?LPA)?/);const r=m?m[0]:'';return r.length>18?r.slice(0,17)+'…':r;};
      return `<button class="card ${isJob?'job':''}" style="--c:${ch.c||'var(--job)'};animation-delay:${i*45}ms"
        onclick="${isJob?`openModal('${ch.id}')`:`select('${ch.id}')`}">
        <div class="t">${L(ch)}</div>
        ${ch.type==='stream'?`<div class="s">${S(ch)}</div>`:''}
        <div class="b">${isJob?`<span class="fchip">${salShort(ch.salary)}</span>`:''}
        <span class="go">${isJob?'▸':'→'}</span></div>
      </button>`;
    }
    function gridHTML(list,offset){
      let h='<div class="grid">';
      list.forEach((ch,i)=>{ h+=cardHTML(ch, offset+i); });
      return h+'</div>';
    }
    if(cur.type!=='start'&&hasStudy&&hasJob){
      html+=`<div class="next-label">${T('nextLabel')}</div>`;
      html+=`<div class="grp-label"><span class="gtag">${T('grpStudy')}</span></div>`;
      html+=gridHTML(kids.filter(k=>k.type!=='job'),0);
      html+=`<div class="grp-label"><span class="gtag">${T('grpJob')}</span></div>`;
      html+=gridHTML(kids.filter(k=>k.type==='job'),kids.filter(k=>k.type!=='job').length);
    } else {
      html+=`<div class="next-label">${cur.type==='start'?T('nextFromStart'):T('nextLabel')}</div>`;
      html+=gridHTML(kids,0);
    }
  }

  /* v13: cross-stream — 'also' list wale options is path par bhi dikhte hain */
  const xlist = (cur.id!=='c10') ? FLAT.filter(n=>Array.isArray(n.also)&&n.also.includes(cur.id)) : [];
  if(xlist.length){
    html+=`<details class="xwrap"><summary><span class="xt">${T('xOpen')}</span><span class="cnt">${xlist.length} ▸</span></summary><div class="xbody">`;
    html+='<div class="grid">';
    xlist.forEach((ch,i)=>{
      const fshort=s=>s?s.split('·')[0].trim():'';
      const salShort=s=>{const m=(s||'').match(/₹[0-9][^ ·(—]*(?: ?LPA)?/);const r=m?m[0]:'';return r.length>18?r.slice(0,17)+'…':r;};
      html+=`<button class="card x-card" style="--c:${ch.c||'var(--job)'};animation-delay:${i*45}ms" onclick="switchTo('${ch.id}')">
        <div class="t">${L(ch)}</div>
        <div class="b"><span class="go">→</span></div>
        <span class="x-tag">${T('xTag')}</span>
      </button>`;
    });
    html+='</div></div></details>';
  }

  if(cur.type==='course'){
    if(Array.isArray(cur.col)&&cur.col.length){
      html+=`<details class="info-box col-box"><summary>${T('colT')}<span class="cnt">${cur.col.length}</span></summary><div class="body">`;
      cur.col.forEach(c=>{ html+=`<div class="col-i">${c}</div>`; });
      html+=`<div class="src-note">${T('colSrc')}</div></div></details>`;
    }
    const alts=(lang==='hi'&&HI.alt[cur.id])?HI.alt[cur.id]:((lang==='en'&&ENG.alt[cur.id])?ENG.alt[cur.id]:cur.alt);
    if(Array.isArray(alts)&&alts.length){
      html+=`<details class="info-box alt-box"><summary>${T('altT')}<span class="cnt">₹</span></summary><div class="body">`;
      alts.forEach(a=>{ html+=`<div class="alt-i"><b>${a.t}</b><span class="alt-f">${a.f}</span><div class="alt-w">${a.w}</div></div>`; });
      html+=`<div class="src-note">${T('altSrc')}</div></div></details>`;
    }
  }

  const bizArr=(lang==='hi'&&HI.biz[cur.id])?HI.biz[cur.id]:((lang==='en'&&ENG.biz[cur.id])?ENG.biz[cur.id]:cur.biz);
  if(Array.isArray(bizArr)&&bizArr.length){
    html+=`<details class="info-box biz-box"><summary>${T('bizT')}<span class="cnt">${bizArr.length}</span></summary><div class="body">`;
    bizArr.forEach(b=>{ html+=`<div class="biz-i">${b}</div>`; });
    html+=`<div class="src-note">${T('bizSrc')}</div></div></details>`;
  }
  const sch=(lang==='hi'&&HI.schol[cur.id])?HI.schol[cur.id]:((lang==='en'&&ENG.schol[cur.id])?ENG.schol[cur.id]:cur.schol);
  if(sch){ html+=`<div class="schol-line"><b>${T('scholT')}</b> ${sch}</div>`; }

  main.innerHTML=html;
}

let _hist=[];
function _push(){ _hist.push(path.slice()); try{ history.pushState({h:_hist.length},''); }catch(e){} }
if(typeof window!=='undefined'&&window.addEventListener){ window.addEventListener('popstate', function(){ if(_hist.length){ path=_hist.pop(); render(); window.scrollTo({top:0,behavior:'smooth'}); } }); }
function select(id){ _push(); path.push(id); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function switchTo(id){ _push(); path=pathTo(id); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goto(i){ _push(); path=path.slice(0,i+1); render(); }
function resetAll(){ _push(); path=['c10']; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function filterDir(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('.dir-item').forEach(el=>{
    el.classList.toggle('hide', q.length>0 && !el.dataset.n.includes(q));
  });
  document.querySelectorAll('.dir-dom').forEach(d=>{
    if(q.length>0){
      const has=[...d.querySelectorAll('.dir-item')].some(el=>!el.classList.contains('hide'));
      d.open=has; d.style.display=has?'':'none';
    }else{ d.open=false; d.style.display=''; }
  });
}

/* ================= SEARCH ================= */
function doSearch(q){
  const box=document.getElementById('sr');
  q=q.trim().toLowerCase();
  if(q.length<2){ box.classList.remove('open'); return; }
  const hits=FLAT.filter(n=>n.id!=='c10' && (
    (lang==='hi'?(HI.labels[n.id]||n.label):n.label).toLowerCase().includes(q) ||
    (n.label.toLowerCase().includes(q)) || (n.sub||'').toLowerCase().includes(q)
  )).slice(0,8);
  if(!hits.length){ box.innerHTML=`<div class="sr-empty">${T('noResults')}</div>`; box.classList.add('open'); return; }
  let html='';
  hits.forEach(h=>{
    const p=PARENT[h.id]?find(PARENT[h.id]):null;
    const ctx=p?L(p):'';
    html+=`<button class="sr-item" onclick="jumpTo('${h.id}')">
      <span class="a">${L(h)}</span><span class="b">${ctx?ctx+' \u25B8 ':''}${S(h)}</span></button>`;
  });
  box.innerHTML=html;
  box.classList.add('open');
}
function jumpTo(id){
  document.getElementById('sr').classList.remove('open');
  document.getElementById('searchBox').value='';
  path=pathTo(id);
  render();
  if(find(id).type==='job') openModal(id);
  else window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap')) document.getElementById('sr').classList.remove('open');
});

/* ================= SHARE ================= */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function sharePage(){
  const text=(lang==='hi'?'कक्षा 10 से नौकरी तक — अपना करियर रास्ता खुद चुनें! ':'Class 10 to Job — explore your career path! ') + location.href;
  if(navigator.share){ navigator.share({title:'Career Path Explorer — Sajhi Shiksha', text}).catch(()=>{}); }
  else{ navigator.clipboard.writeText(text).then(()=>toast(T('copied'))).catch(()=>toast(text)); }
}
function shareMyPath(){
  const names=path.map(id=>L(find(id)));
  const text=`${T('pathLabel')}: ${names.join(' \u2192 ')} — Career Explorer (Sajhi Shiksha) ${location.href}`;
  if(navigator.share){ navigator.share({title:'My Career Path', text}).catch(()=>{}); }
  else{ navigator.clipboard.writeText(text).then(()=>toast(T('copied'))).catch(()=>toast(text)); }
}

/* ================= LANGUAGE ================= */
function setLang(l){
  lang=l; localStorage.setItem('cpe_lang',l); render();
  if(document.getElementById('overlay').classList.contains('open') && currentJobId) reModal(currentJobId);
}

/* ================= JOB MODAL ================= */
let currentJobId=null;
function reModal(id){ openModal(id); }
function openModal(id){
  currentJobId=id;
  const j=TRJ(find(id));
  const sheet=document.getElementById('sheet');
  const aiCls=j.ai==='high'?'high':(j.ai==='med'?'med':'low');
  const aiTxt=j.ai==='high'?T('aiHigh'):(j.ai==='med'?T('aiMed'):T('aiLow'));
  sheet.innerHTML=`
    <div class="grab"></div>
    <div class="close-row"><button class="closex" onclick="closeModal()">${T('close')}</button></div>
    <div class="jt">${L(j)}</div>
    <div class="ai-row"><span class="ai-chip ${aiCls}">${T('aiL')}: ${aiTxt}</span><span class="arn">${j.ain||''}</span>${j.dir?`<span class="dir-chip ${j.dir}">${T(j.dir==='govt'?'dirGovt':'dirBiz')}</span>`:''}</div>
    <div class="facts" style="--c:var(--job)">
      <div class="fact"><div class="k">${T('fSalary')}</div><div class="v">${j.salary}</div></div>
      <div class="fact"><div class="k">${T('fExam')}</div><div class="v">${j.exam}</div></div>
      <div class="fact"><div class="k">${T('fDuration')}</div><div class="v">${j.duration}</div></div>
      <div class="fact"><div class="k">${T('fElig')}</div><div class="v">${j.elig}</div></div>
      ${(()=>{const p=find(PARENT[j.id]);return (p&&p.fees)?`<div class="fact"><div class="k">${T('fRouteFees')}</div><div class="v">${FE(p)}</div></div>`:''})()}
    </div>
    <div class="block"><div class="k">${T('fGrowth')}</div><div class="v">${j.growth}</div></div>
    <div class="block"><div class="k">${T('fColleges')}</div><div class="v">${j.colleges}</div></div>
    <div class="block"><div class="k">${T('fSkills')}</div><div class="v">${j.skills}</div></div>
    ${j.ladder?`<div class="block"><div class="k">${T('fLadder')}</div><div class="v">${j.ladder}</div></div>`:''}
    ${j.coach?`<div class="block"><div class="k">${T('fCoach')}</div><div class="v">${j.coach}</div></div>`:''}
    ${j.comp?`<div class="block"><div class="k">${T('fComp')}</div><div class="v">${j.comp}</div></div>`:''}
    ${j.reality_note?`<div class="realnote"><span class="k">${T('reality')}</span>${j.reality_note}</div>`:''}
    <a class="wa-cta" href="${waJobLink(j)}" target="_blank" rel="noopener">${T('waCta')}</a>
    <button class="share-path" onclick="shareMyPath()">${T('sharePath')}</button>
    <a class="vidlink" href="https://www.youtube.com/@kapilpundir2" target="_blank" rel="noopener">\u25B6 ${T('videoBtn')}</a>
    <div class="cta">${T('cta')}<br><a class="ch-inline" href="${CH_LINK}" target="_blank" rel="noopener">${T('chJoin')}</a></div>
  `;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function TRJ(n){ if(lang!=='en'||!n||n.type!=='job') return n; const e=ENG.jobs[n.id]; return e?Object.assign({},n,e):n; }
function openInfo(kind){
  const items = kind==='exam' ? T('exams') : T('schols');
  const title = kind==='exam' ? T('resExam') : T('resSchol');
  let html = `<div class="grab"></div>
    <div class="close-row"><button class="closex" onclick="closeModal()">${T('close')}</button></div>
    <div class="jt">${title}</div>`;
  items.forEach(it=>{
    if(it.g){ html+=`<div class="info-grp">${it.g}</div>`; return; }
    html+=`<div class="info-row"><div class="ir-t">${it.n||it.t||''}</div><div class="ir-d">${it.d||it.f||''}</div>${it.s?`<span class="st st-${it.s}">${it.s==='C'?T('stC'):(it.s==='E'?T('stE'):T('stN'))}</span>`:''}</div>`;
  });
  html+=`<div class="src-note">${T('resSrc')}</div>`;
  html+=`<div class="cta">${T('cta')}<br><a class="ch-inline" href="${CH_LINK}" target="_blank" rel="noopener">${T('chJoin')}</a></div>`;
  const sheet=document.getElementById('sheet'); sheet.innerHTML=html;
  document.getElementById('overlay').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

render();
</script>
