<!DOCTYPE html>
<!-- Sajhi Shiksha Career Path Explorer v7.1 — 277 nodes, 3 languages (Hinglish/English/Hindi) -->
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Path Explorer — Class 10 se Job tak | Sajhi Shiksha</title>
<meta property="og:title" content="Career Path Explorer — Class 10 se Job tak">
<meta property="og:description" content="Apna career raasta khud chuno — Class 10 se lekar salary, exam, fees aur poori details tak. Career paths, fees, exams, salary aur reality-check — sab ek jagah. FREE tool by Sajhi Shiksha.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Azeret+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --surface:#ffffff; --surface-dim:#f3efe8;
    --text:#1a2430; --text-dim:#5a6472; --border:#e2ddd3;
    --pcb:#2e7d4f; --pcb-bg:#eaf4ee;
    --pcm:#0369a1; --pcm-bg:#e8f1f8;
    --com:#b45309; --com-bg:#fbf0e3;
    --arts:#be123c; --arts-bg:#faeaee;
    --iti:#57534e; --iti-bg:#f0efed;
    --poly:#0891b2; --poly-bg:#e6f4f8;
    --job:#881337; --job-bg:#f8eaef;
    --font-body:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;
    --font-mono:'Azeret Mono','Noto Sans Devanagari',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);
    background-image:radial-gradient(circle at 12% 8%,rgba(46,125,79,.05),transparent 40%),
                     radial-gradient(circle at 88% 92%,rgba(3,105,161,.05),transparent 40%);
    min-height:100vh;padding-bottom:60px}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}

  header{padding:24px 0 10px;position:relative}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--pcb);box-shadow:0 0 0 3px var(--pcb-bg)}
  .top-actions{display:flex;gap:8px;align-items:center}
  .lang-toggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .lang-toggle button{border:none;background:none;padding:7px 14px;font-family:var(--font-mono);font-size:11.5px;
    font-weight:600;color:var(--text-dim);cursor:pointer;letter-spacing:.04em;transition:all .15s}
  .lang-toggle button.active{background:var(--text);color:#fff}
  .sharebtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 16px;
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--text);cursor:pointer;letter-spacing:.04em}
  .sharebtn:hover{border-color:var(--text-dim)}
  h1{font-size:clamp(22px,4.6vw,33px);font-weight:800;line-height:1.15;margin-top:10px;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--pcm)}
  .tagline{color:var(--text-dim);font-size:14px;margin-top:6px;max-width:640px;line-height:1.55}

  .search-wrap{position:relative;margin-top:16px;max-width:440px}
  .search-wrap input{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--surface);
    padding:11px 14px 11px 38px;font-family:var(--font-body);font-size:13.5px;color:var(--text);outline:none}
  .search-wrap input:focus{border-color:var(--pcm)}
  .search-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px}
  .sr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;box-shadow:0 16px 40px -18px rgba(26,36,48,.4);z-index:60;overflow:hidden;display:none}
  .sr.open{display:block}
  .sr-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:none;
    padding:10px 14px;cursor:pointer;font-family:var(--font-body)}
  .sr-item:hover{background:var(--surface-dim)}
  .sr-item .a{font-size:13.5px;font-weight:700}
  .sr-item .b{font-size:11.5px;color:var(--text-dim)}
  .sr-empty{padding:12px 14px;font-size:12.5px;color:var(--text-dim)}

  .trail-bar{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:12px 0 10px}
  .trail{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
  .chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;
    color:var(--text-dim);cursor:pointer;transition:all .18s ease;font-family:var(--font-body)}
  .chip:hover{border-color:var(--text-dim)}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text)}
  .chip .n{font-family:var(--font-mono);font-size:10px;opacity:.55}
  .sep{color:var(--text-dim);font-size:11px;flex:none}
  .reset{margin-left:auto;flex:none;font-family:var(--font-mono);font-size:11px;background:none;
    border:1px dashed var(--border);border-radius:8px;padding:5px 10px;color:var(--text-dim);cursor:pointer}
  .reset:hover{color:var(--job);border-color:var(--job)}

  .now-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;
    margin:10px 0 6px;position:relative;overflow:hidden;box-shadow:0 10px 28px -18px rgba(26,36,48,.25)}
  .now-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--text))}
  .now-card .lvl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--c,var(--text-dim));display:flex;align-items:center;gap:7px}
  .now-card .lvl::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--c,var(--text-dim))}
  .now-card h2{font-size:clamp(19px,3.4vw,25px);font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
  .now-card .desc{color:var(--text-dim);font-size:13.5px;line-height:1.55;max-width:640px}

  .siblings{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 0 4px}
  .siblings .sk{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
  .sib{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 11px;
    font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;font-family:var(--font-body);transition:all .15s}
  .sib:hover{color:var(--text);border-color:var(--text-dim)}

  .arrow-flow{text-align:center;color:var(--text-dim);font-size:18px;line-height:1;margin:12px 0;position:relative}
  .arrow-flow::before{content:'';position:absolute;left:50%;top:-12px;bottom:calc(100% - 14px);width:2px;
    background:var(--border);transform:translateX(-50%)}
  .arrow-flow span{background:var(--bg);padding:4px 8px;position:relative;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}

    font-family:var(--font-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim)}
    font-size:10px;color:var(--text);font-weight:600}
  .next-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .grp-label{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
  .grp-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .grp-label .gtag{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 7px}
  .ask-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .ask-t{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--text)}
  .ask-in{width:100%;min-height:64px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:var(--font-body);font-size:13px;resize:vertical;background:var(--bg);color:var(--text);box-sizing:border-box}
  .ask-in:focus{outline:2px solid #16a34a33;border-color:#16a34a}
  .ask-btn{margin-top:8px;width:100%;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.04em}
  .ask-btn:hover{opacity:.9}
  .ask-note{font-size:11.5px;color:var(--text-dim);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px 14px;
    cursor:pointer;position:relative;text-align:left;font-family:var(--font-body);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;display:flex;flex-direction:column;
    gap:7px;min-width:0;animation:fadeUp .4s ease both}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(26,36,48,.35);border-color:var(--c)}
  .card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
  .card .t{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .card .s{font-size:12px;color:var(--text-dim);line-height:1.45}
  .card .fee{font-size:11.5px;color:#047857;font-weight:700;line-height:1.4}
  .card .b{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .badge{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;
    border-radius:6px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 10%,white)}
  .go{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:.05em}
  .card.job{border-style:dashed}
  .card.job:hover{border-style:solid}

  .start-hero{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--surface);
    border:1px solid var(--border);border-radius:18px;padding:34px 22px 28px;margin:10px 0 6px;
    box-shadow:0 10px 28px -18px rgba(26,36,48,.25);animation:fadeUp .4s ease both}
  .start-hero .big{width:74px;height:74px;border-radius:50%;background:var(--text);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:21px;font-family:var(--font-mono);margin-bottom:14px}
  .start-hero h2{font-size:clamp(20px,4vw,27px);font-weight:800}
  .start-hero p{color:var(--text-dim);font-size:14px;margin-top:6px;max-width:480px;line-height:1.55}

  .info-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-top:14px;overflow:hidden}
  .info-box summary{padding:14px 18px;cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:10px;user-select:none}
  .info-box summary::-webkit-details-marker{display:none}
  .info-box summary::before{content:'\25B8';font-family:var(--font-mono);color:var(--text-dim);transition:transform .2s;font-size:11px}
  .info-box[open] summary::before{transform:rotate(90deg)}
  .info-box summary .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.08em}
  .info-box .body{padding:2px 18px 16px}
  .scheme{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--surface-dim);font-size:13px;line-height:1.55}
  .scheme:first-child{border-top:none}
  .scheme b{white-space:nowrap;font-family:var(--font-mono);font-size:12px}
  .myth{padding:10px 0;border-top:1px solid var(--surface-dim)}
  .myth:first-child{border-top:none}
  .myth .m{font-size:13px;font-weight:700;color:var(--job)}
  .myth .m::before{content:'\2717 ';font-family:var(--font-mono)}
  .myth .f{font-size:13px;color:var(--text);line-height:1.5;margin-top:3px}
  .myth .f::before{content:'\2713 ';color:var(--pcb);font-family:var(--font-mono);font-weight:700}

  .dir-dom{border-top:1px solid var(--surface-dim)}
  .dir-dom:first-child{border-top:none}
  .dir-dom summary{padding:10px 0;cursor:pointer;font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
  .dir-dom summary::-webkit-details-marker{display:none}
  .dir-dom summary::before{content:'\25B8';color:var(--text-dim);font-family:var(--font-mono);font-size:10px;transition:transform .2s}
  .dir-dom[open] summary::before{transform:rotate(90deg)}
  .dir-dom .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
  .dir-items{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
  .dir-item{background:var(--surface-dim);border:1px solid var(--border);border-radius:999px;
    padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--text);cursor:default}
  .dir-item.hide{display:none}
  .dir-filter{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--surface);
    padding:9px 13px;font-family:var(--font-body);font-size:12.5px;margin-bottom:10px;outline:none}
  .dir-filter:focus{border-color:var(--pcm)}
  .src-note{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}

  .overlay{position:fixed;inset:0;background:rgba(26,36,48,.5);backdrop-filter:blur(3px);z-index:90;
    display:none;align-items:flex-end;justify-content:center;padding:0}
  .overlay.open{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:10px 22px 26px;
    max-height:86vh;overflow-y:auto;animation:sheetUp .32s cubic-bezier(.2,.8,.25,1) both}
  @media(min-width:700px){.overlay{align-items:center;padding:20px}.sheet{border-radius:18px;padding:20px 26px 24px}}
  .sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--border);margin:4px auto 12px}
  @media(min-width:700px){.sheet .grab{display:none}}
  .sheet .jt{font-size:21px;font-weight:800;letter-spacing:-.01em}
  .ai-row{display:flex;align-items:center;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
  .ai-chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;padding:3px 9px;border-radius:6px;font-weight:700}
  .ai-chip.low{background:#e7f5ec;color:#166534}
  .ai-chip.med{background:#fdf3d7;color:#92400e}
  .ai-chip.high{background:#fde5e5;color:#b91c1c}
  .ai-row .arn{font-size:11.5px;color:var(--text-dim);line-height:1.4}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  @media(max-width:520px){.facts{grid-template-columns:1fr}}
  .fact{background:var(--surface-dim);border-radius:12px;padding:12px 14px;border-left:3px solid var(--c)}
  .fact .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim)}
  .fact .v{font-size:14px;font-weight:700;margin-top:4px;line-height:1.4}
  .sheet .block{margin:12px 0}
  .sheet .block .k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--c,var(--job));margin-bottom:5px}
  .sheet .block .v{font-size:13.5px;line-height:1.65;color:var(--text)}
  .realnote{margin-top:14px;background:#fdf3d7;border:1px solid #f5dfa0;border-radius:12px;padding:12px 16px;
    font-size:13px;line-height:1.55;color:#713f12}
  .realnote .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:3px}
  .vidlink{display:block;margin-top:14px;border:1.5px solid #b91c1c;background:#fff;color:#b91c1c;border-radius:12px;
    padding:11px 16px;font-family:var(--font-body);font-size:13.5px;font-weight:700;cursor:pointer;
    text-decoration:none;text-align:center;transition:all .15s}
  .vidlink:hover{background:#b91c1c;color:#fff}
  .wa-cta{display:block;margin-top:14px;border:none;background:#16a34a;color:#fff;border-radius:12px;
    padding:13px 16px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;
    text-decoration:none;text-align:center;transition:opacity .15s}
  .wa-cta:hover{opacity:.9}
  .ch-inline{color:var(--job);font-weight:700;text-decoration:none}
  .wa-float{position:fixed;bottom:22px;right:22px;width:54px;height:54px;border-radius:50%;
    background:#16a34a;display:flex;align-items:center;justify-content:center;z-index:80;
    box-shadow:0 8px 24px -6px rgba(22,163,74,.55);transition:transform .15s}
  .wa-float:hover{transform:scale(1.08)}
  .share-path{margin-top:10px;width:100%;border:none;background:var(--text);color:#fff;border-radius:12px;
    padding:12px 16px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
  .share-path:hover{opacity:.88}
  .cta{margin-top:12px;background:var(--job-bg);border:1px solid color-mix(in srgb,var(--job) 30%,white);
    border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.55;color:var(--text)}
  .cta b{color:var(--job)}
  .close-row{display:flex;justify-content:flex-end;margin-top:4px}
  .closex{font-family:var(--font-mono);font-size:12px;background:none;border:1px solid var(--border);
    border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--text-dim)}
  .closex:hover{color:var(--text);border-color:var(--text-dim)}

  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;
    gap:10px 24px;align-items:center;justify-content:space-between}
  footer .fb{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
  footer .fn{font-size:12.5px;color:var(--text-dim)}
  footer .fn a{color:var(--pcm);text-decoration:none;font-weight:700}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);
    color:#fff;border-radius:10px;padding:11px 20px;font-size:13px;font-weight:600;z-index:200;
    opacity:0;pointer-events:none;transition:all .3s ease;font-family:var(--font-body)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.x-card{position:relative;border-style:dashed}
.x-tag{position:absolute;top:6px;right:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;background:rgba(0,0,0,.35);color:#fff;border-radius:4px;padding:2px 6px;opacity:.85}
.oc{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;margin:2px 0;opacity:.85}
.oc.open{color:#7ee08f}
.oc.cl{color:#d8a7a7}
.col-i{padding:4px 0;border-bottom:1px dashed rgba(127,127,127,.2);font-size:13px}
.alt-i{margin:8px 0;padding:8px 10px;border-left:3px solid rgba(127,127,127,.5);background:rgba(127,127,127,.08)}
.alt-i b{display:block}
.alt-f{display:block;font-size:12px;color:#e8c96a;margin:2px 0}
.alt-w{font-size:12px;opacity:.85}
.dir-chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:2px 6px;margin-left:8px;white-space:nowrap}
.dir-chip.govt{color:#7ee08f}
.dir-chip.biz{color:#e8c96a}
.fchip{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;border:1px solid rgba(127,127,127,.45);border-radius:20px;padding:2px 8px;opacity:.9;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .go{font-size:20px;font-weight:700;opacity:.95}
.card:active{transform:scale(.97);opacity:.92}
.info-box .cnt{margin-left:auto;min-width:22px;text-align:center}
.xwrap{margin:10px 0 4px;border:1px dashed rgba(127,127,127,.45);border-radius:10px;padding:0 12px}
.xwrap summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;font-size:13px}
.xwrap summary::-webkit-details-marker{display:none}
.xwrap .xt{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.xwrap .cnt{margin-left:auto}

 LPA)","ain":"Animal handling and surgery are hands-on practical work, AI cannot replace them."},"j_unani_naturo":{"salary":"₹3-6 LPA start · senior/own wellness practice ₹60K-1.5L/month","exam":"NEET UG · AIAPGET for PG (MD Unani/Naturopathy)","duration":"5.5 years (incl. 1 year internship) · MD 3 years optional","elig":"10+2 PCB 50% (40% reserved) · for BUMS, Urdu/Arabic/Persian must be passed in 10th or 12th (NCISM rule)","growth":"Hakeem/naturopathy practice · government AYUSH Medical Officer (state pay scale) · 2-3× salary after MD","ain":"It is holistic hands-on treatment, AI's role is minimal."},"j_occthera":{"salary":"₹3.5-5.5 LPA · senior/own rehab centre ₹12-20 LPA+","exam":"IPU CET / MET / SVNIRTAR CET or university exams/merit","duration":"BOT 4.5 years (4 + 6-month internship) · MOT 2 years","elig":"10+2 PCB 50-60% (5% relaxation for reserved categories)","growth":"hospital OT → MOT → senior therapist/own rehab centre (₹5-12 LPA after MOT)","ain":"In physical rehab the human touch is central, hard for AI to replace."},"j_optom":{"salary":"₹3.2-4.5 LPA (Lenskart/hospitals/chains) · senior ₹6-10 LPA","exam":"CUET / MET / institute exams (AIIMS, SANKARA-type) or merit","duration":"B.Optom 4 years (incl. internship) · M.Optom 2 years","elig":"10+2 PCB min 50-55%","growth":"optometrist → senior → store/clinic head · corporate eye-care leadership after M.Optom","ain":"Basic refraction is getting automated, but clinical judgment and fitting are human work."},"j_audioslp":{"salary":"₹3-6 LPA · senior ₹5-10 LPA after M.Sc","exam":"AIIMS / MERIT / university exams or merit","duration":"BASLP 4 years (incl. internship) · M.Sc Audiology/SLP 2 years","elig":"10+2 PCB 50% (some colleges also accept PCM/PCMB)","growth":"hospital audiology dept → cochlear-implant team → own clinic · RCI registration in some states","ain":"Screening tools are AI-assisted, but therapy and rehab are human-dependent."},"j_nurse_gnm":{"salary":"GNM staff nurse: private ₹15-25K/month, govern Med ₹10-30K; self-study works","ladder":"Cadet → 3rd Officer → Chief Officer → Captain"},"j_pilot":{"salary":"₹12–18 LPA fresh airline → 40–80 LPA senior captain","exam":"DGCA CPL papers → airline type rating","duration":"18–24 months CPL training","elig":"12th PCM + Class 1 medical. Cost: ₹35–55 lakh training","growth":"First Officer → Captain → Training Captain. Investment high but recovery fast.","ain":"safety-critical cockpit — regulations require pilots","coach":"DGCA/CPL Low-Med; flying hours are the cost","ladder":"First Officer → Captain → Training Captain"},"j_defoff":{"salary":"₹56,100/month start (Lieutenant) + MSP ₹15,500 + allowances = in-hand ₹80K–1L → Colonel ₹1.3L+ → General ₹2.25L/month + pension","exam":"NDA/NA written (after 12th) or CDS (after graduation) → SSB interview 5 days → medical. Becoming an officer later from Agniveer is also possible (ACC exam)","duration":"3 years NDA Khadakwasla + 1 year academy (IMA/INA/AFA). CDS route: 1.5 years direct academy","elig":"12th PCM (any stream in Army) for NDA; age 16.5–19.5, unmarried. CDS: graduate, age 19–25","growth":"Lieutenant → Captain → Major → Colonel → Brigadier → General. Free housing, canteen (subsidised ration + airport lounge), free medical for the whole family, free education for children, lifetime pension benefits","ain":"leadership + combat — human","coach":"NDA/CDS/TES Medium — ₹20-50K + SSB prep ₹15-30K; self-study works","comp":"NDA ~3-4 lakh for ~400 seats (<0.2%); STABLE","ladder":"Lt → Capt (~2 yrs) → Maj (~6) → Lt Col (~13, time-scale) → Col/Brig/Maj Gen/Lt Gen (selection)"},"j_armytes":{"salary":"Lieutenant, pay level 10 — basic ₹56,100/month + MSP/allowances, CTC approx ₹17–18L/year","exam":"No separate written exam — shortlist from JEE Main rank, then 5-day SSB + medical","duration":"4 years funded training (3 years CTW + 1 year IMA) → B.E./B.Tech degree","elig":"Unmarried male · 60%+ in 10+2 PCM · JEE Main appeared · age 16.5–19.5 years","growth":"Lieutenant → Captain → Major → Lt Col, Permanent Commission technical corps (Signals/EME/Engineers)","reality_note":"Vacancies are few (~90 per course, twice a year) — SSB is the real filter","ain":"Combat and technical leadership role — no risk from automation"},"j_navytech":{"salary":"Sub Lieutenant, pay level 10 — basic ₹56,100/month + allowances","exam":"No separate written exam — shortlist from JEE Main All India rank, then SSB + medical","duration":"4 years funded B.Tech at INA Ezhimala → Permanent Commission","elig":"70%+ in 10+2 PCM and 50%+ in English · JEE Main appeared · age ~16.5–19.5 · seats for women too","growth":"Sub Lt → Lt → Lt Cdr · submarine/aviation streams by selection","reality_note":"Seats limited (~60 per course) — both JEE rank + SSB need to be strong","ain":"Military officer role — no risk from automation"},"j_statisi":{"salary":"ISI 2025 placement median approx ₹21 LPA (mostly after M.Stat) · Quant Analyst ₹12–35 LPA · Data Scientist ₹8–25 LPA","exam":"ISI Admission Test (May) — UGA (MCQ) + UGB (descriptive), both at 10+2 level maths","duration":"3 years B.Stat · most students complete the 2-year M.Stat pipeline","elig":"12th with Maths + English · entrance is very competitive (INMO awardees get a direct interview channel)","growth":"Data Scientist, Quant Analyst (Goldman/DE Shaw), Actuarial Analyst ₹8–20 LPA, ISS officer via UPSC","ain":"Stats and quant skills are becoming even more valuable in the AI era"},"j_iiser":{"salary":"Direct placements are few — the classic exit is PhD → ISRO/DRDO/academia scientist (ISRO Scientist-SC level-10 pay ₹56,100–1,77,500)","exam":"IAT — 3-hour CBT, 60 questions (Bio/Chem/Maths/Physics) · KVPY/JEE channels closed since 2024","duration":"5-year BS-MS dual degree · IISER Bhopal also has 4-year BTech options","elig":"60%+ in 12th science (current/previous year) (SC/ST/PwD 55%) · max 3 attempts","growth":"PhD India/abroad → scientist ladder · analytics and college teaching too","reality_note":"Wrong goal if you want a job immediately — perfect if you want research","ain":"Research careers are not replaced by AI","coach":"IAT — Medium-High; self-study possible","comp":"IAT ~2,300 seats, ~1% qualification — EXTREME","ladder":"BS-MS → PhD → research scientist"},"j_aviops":{"salary":"Entry ₹3–5 LPA (Flight Ops, Airport Ops, Ground Handling executive)","exam":"CUET-UG or RGNAU's own exam (12th marks + exam + GD + PI weightage)","duration":"3 years · CPL holders get direct 2nd-year entry","elig":"Physics, Maths + English in 12th, 50%+ (5% relaxation for SC/ST)","growth":"Airline/airport operations → management roles · MBA Aviation · pilot route by adding CPL","reality_note":"This is a degree into the aviation industry without the ₹40L+ flying cost","ain":"Automation is increasing in ground ops, but airline/airport coordination is human-heavy"},"j_onlineds":{"salary":"Freshers ₹3.5-8 LPA — depends on skills + projects · an online BS + strong portfolio can reach product companies (approx)","exam":"IIT-M qualifier exam (applications 3 times a year) or JEE-based direct entry · IIM-B DBE: its own entrance test or CUET-UG/JEE-Main percentile","duration":"IIT-M BS 4 years (Foundation/Diploma/BSc exit points) · IIM-B BBA 3-6 years flexible","elig":"IIT-M BS Data Science: 12th from any stream, no age limit · IIM-B BBA-DBE: Maths in 10th + ~60% in 12th — can also be done in parallel with another degree","growth":"You get a certificate/diploma at every exit point — low risk, study alongside work. NEP's new world of structured online degrees","ain":"DS roles are competitive — portfolio + projects matter more than the degree"},"j_banker":{"salary":"Basic ₹48,480/month · gross ~₹65-85K/month approx (SBI CTC ~₹22L Mumbai)","exam":"IBPS PO/SO, SBI PO (bank jobs) → or CAT for MBA","duration":"3 years","elig":"12th Commerce (any %)","growth":"Scale I → Branch Manager → AGM/GM → MD · promotions get faster with JAIIB/CAIIB","ain":"basic banking is going digital — relationship + advisory roles stay human"},"j_actuary":{"salary":"₹5–10 LPA (2–3 papers) → ₹25-60 LPA (fellow, all papers)","exam":"ACET entry → IAI actuarial exams (9 papers, only ~1,000 Fellows in India — a big shortage)","duration":"Parallel with degree, 4–8 years for all papers","elig":"12th PCM/Commerce with strong maths (85%+)","growth":"Actuarial analyst → associate → fellow actuary. Insurance/pension/investment firms. India's most underrated high-pay career","ain":"regulated risk judgment — protected by certification"},"j_teacher_com":{"salary":"TGT ₹44,900 basic (₹55-60K in-hand) · PGT (M.Com + B.Ed) ₹47,600 basic (₹60-65K) + DA/HRA — 7th CPC (approx)","exam":"B.Ed entrance (CUET-PG or state CET) → CTET Paper 2 → KVS/NVS/DSSSB/state Super-TET recruitment","duration":"B.Com 3 years + B.Ed 2 years (TGT) · PGT Commerce: M.Com + B.Ed","elig":"B.Com graduate + B.Ed — you can become a Commerce/SST/Economics subject teacher","growth":"TGT → PGT (after M.Com) → Vice Principal → Principal · schools + coaching/own academy options","ain":"Teaching + mentorship is human — AI assists, does not replace"},"j_ca":{"salary":"Fresher ₹7–12 LPA (Big 4) → 5 years exp ₹15–25 LPA → Partner/own firm ₹40L+ / unlimited","exam":"CA Foundation → Intermediate → Articleship (2 yr, stipend provided) → Final (ICAI). Pass rate per attempt: 5–10%, 2–3 attempts are completely normal","duration":"4.5–5 years (start straight after 12th, no college needed)","elig":"12th from any stream (Commerce is the best fit)","growth":"Audit/tax → Manager → Partner, or your own practice, or CFO track. The ICAI qualification also holds value in UK/UAE/Australia","ain":"routine audit/tax is getting automated — advisory judgment stays human","coach":"Medium — ₹50K-1.5L total; ICAI material covers most of it","comp":"CA Final pass ~10-15%/attempt — EXTREME per attempt; STABLE demand","ladder":"Article → Analyst → AM → Manager (~5-8 yrs) → Senior Manager → Partner (equity ~12-15 yrs); industry CFO track too"},"j_mgmt":{"salary":"₹3–5 LPA fresh → IIM MBA 20–35 LPA avg","exam":"IPMAT (IIM integrated) / institute test → CAT for MBA","duration":"3 years (or 5-yr integrated)","elig":"12th any stream","growth":"BBA → MBA (CAT/XAT) → consulting/banking/marketing roles. Managing the family business too.","ain":"entry-level analyst tasks are AI-assisted — leadership stays human"},"j_digmark":{"salary":"₹3–5 LPA start → manager ₹8–12 LPA → director ₹15-30 LPA","exam":"No entrance exam — certifications (Google, Meta) + portfolio","duration":"3–6 month course + degree in parallel","elig":"12th any stream","growth":"Executive → team lead → manager → director. Freelancing ₹50K–1.5L/month is also possible. India's digital ad market is $46B+","ain":"AI is automating ad optimization — strategy + creativity stay human"},"j_csa":{"salary":"₹5–8 LPA fresh → 15-25 LPA senior","exam":"CMA (ICMAI) / CS (ICSI) foundation→final","duration":"3–4 years","elig":"12th any stream","growth":"CS: company compliance head → legal advisor. CMA: costing → CFO track.","ain":"compliance automation is increasing — advisory is safe"},"j_itdev":{"salary":"₹2.5–5 LPA → 6–12 LPA after MCA","exam":"Institute entrance → NIMCET (MCA)","duration":"3 years","elig":"12th (Maths preferred)","growth":"BCA → MCA (NIMCET) → software developer / IT analyst. A common route from Commerce into IT.","ain":"basic support/coding is getting automated — specialize (cloud/security)"},"j_mcadev":{"salary":"Fresher ₹3.5-8 LPA · ₹8-20 LPA in 3-5 years — NIT-MCA grads reach product companies (approx)","exam":"NIMCET (NIT MCA CET — NITs like Trichy) or CUET-PG (JNU-type); maths at 10+2 or graduation level required","duration":"2 years (JNU pattern) · 3 years (NIT Trichy pattern)","elig":"BCA/B.Sc CS or any graduation with Maths (10+2/graduate level) ~55% — a solid PG route to a software career without B.Tech","growth":"Developer → Senior Developer → Tech Lead — considered comparable to B.Tech CSE entry in the industry","ain":"Just like software engineering — AI tools are there for everyone, top skills decide the outcome"},"j_cfa":{"salary":"₹4–8 LPA → CFA+MBA: ₹12–40 LPA (investment banking)","exam":"CFA (3 levels, global) or FRM — in parallel with degree","duration":"CFA: 2.5–4 years (self-paced)","elig":"Graduation (final year too)","growth":"Analyst → senior analyst → fund manager. B.Com + CFA is the fastest non-IIT route to investment banking","ain":"analysis is AI-assisted — client trust + judgment stay human"},"j_finanalyst":{"salary":"₹2.5-4.5 LPA accounts/audit · analyst trainee ₹3-6 LPA approx","exam":"Merit-based (12th marks) · some colleges CUET","duration":"3-year degree","elig":"12th pass, 45%+ (reserved 40%)","growth":"Accounts exec → Senior Accountant → Finance Manager → CFO track","reality_note":"A plain B.Com alone caps at ₹5-7 LPA — specialisation is the multiplier","ain":"Routine bookkeeping is getting automated, but analysis and judgment roles are safe"},"j_capmkt":{"salary":"₹2.5-4.5 LPA fresher approx","exam":"Degree merit-based · NISM certs as add-on","duration":"3-year degree (BFM)","elig":"12th pass, 45%+ (reserved 40%)","growth":"Market ops → Dealer/fund ops → Treasury support","ain":"Basic trade execution is getting automated, but fund ops and treasury need judgment"},"j_economist":{"salary":"₹3-7 LPA entry · consulting/research ₹5-10 LPA approx","exam":"CUET-UG (DU/GIPE/BHU) · IIT Kanpur BS Economics via JEE Advanced","duration":"3 years (NEP 4th year option)","elig":"12th 50%+ with Maths/Applied Maths (compulsory)","growth":"MA Eco (DSE/ISI/IGIDR) → RBI Grade B DEPR / Indian Economic Service / analyst","ain":"Research, policy and interpretation roles are difficult for AI"},"j_taxlaw":{"salary":"Corporate ₹5-12 LPA · litigation start ₹3-6 LPA approx","exam":"CLAT / AILET / SLAT / MHCET Law","duration":"5-year integrated","elig":"12th any stream, 45%+ (SC/ST 40%)","growth":"Associate → Senior Associate → Partner; tax/M&A/banking-finance law best fit","ain":"AI cannot take legal judgment and negotiation; AI will assist with drafting"},"j_globalacc":{"salary":"₹5-10 LPA India · overseas roles pay more approx","exam":"No entrance — ACCA quarterly CBE (Mar/Jun/Sep/Dec) · CIMA on-demand + case study","duration":"ACCA 2-4 years · CIMA 2-4 years + 3 years experience","elig":"ACCA: 65% in English + Maths/Accounts in 12th · CIMA: 12th pass is enough","growth":"Big 4 global audit → MNC finance → Middle East/UK/Singapore roles","reality_note":"In India, statutory audit signing power lies only with CAs — ACCA does not get that monopoly","ain":"Standard reporting is getting automated, but global strategy and judgment roles are safe"},"j_ipmmgr":{"salary":"₹20 LPA+ average at MBA-exit (top IIMs) approx","exam":"IPMAT (IIM Indore test + IIM Rohtak's own test)","duration":"5 years (bachelor's exit option after 3 years)","elig":"12th with 60% (both Class X and XII) · age ~20 max General","growth":"Direct MBA-level placements — no separate CAT needed","reality_note":"IIM Amritsar requires Maths in 12th; Indore does not","ain":"Leadership and strategy roles are considered AI-resistant"},"j_mcomroute":{"salary":"₹3-6 LPA alone · NET lectureship ₹6-10 LPA (basic ₹57,700+) approx","exam":"CUET-PG (DU/BHU) · then UGC-NET/JRF for teaching","duration":"2 years","elig":"B.Com/B.Com (Hons) 50%+","growth":"Assistant Professor → Professor; or senior accounts/finance roles","ain":"Teaching and senior judgment-based roles are automation-safe"},"j_rbieff":{"salary":"Basic ₹78,450/month · gross ~₹1.55L/month (₹16-22 LPA) approx","exam":"RBI Grade B: Phase I → Phase II → Interview","duration":"Preparation 1-1.5 years typical","elig":"Graduation 60% (SC/ST/PwBD 50%) or PG 55% · age 21-30","growth":"Grade B → Grade C → D (CGM) → Executive Director → Deputy Governor track","reality_note":"DEPR stream is for MA Economics holders, DSIM for statistics master's","ain":"Regulation and policy government roles — no automation risk"},"j_cgloff":{"salary":"AAO in-hand ~₹75K/month metros · IT Inspector ₹55-70K/month approx","exam":"SSC CGL Tier 1 + Tier 2 (CBT)","duration":"1 exam cycle (~1 year) · preparation 8-12 months","elig":"Any graduate · age 18-27 (Group C) / 18-30 (Group B)","growth":"Income Tax Inspector → ITO → Assistant Commissioner; Auditor → AAO","reality_note":"Selection is ~1-2%, but better odds than UPSC","ain":"Government posts — no risk from automation","coach":"Medium — ₹15-40K; self-study is most common","comp":"SSC CGL ~30-40 lakh applicants, ~20-30K posts (<0.1%); STABLE","ladder":"AAO/Inspector (Level 7-8) → Section Officer → Under Secretary → Deputy Secretary"},"j_riskanalyst":{"salary":"₹6-10 LPA entry · ₹18-33+ LPA senior approx","exam":"FRM Part I + Part II (May/Aug/Nov windows)","duration":"1-2 years (~500 study hours total)","elig":"No eligibility criteria — you can sit even after 12th","growth":"Risk Analyst → Chief Risk Officer; pairs best with CFA/CA","reality_note":"FRM is NSQF Level 9 in India — benchmarked as equivalent to a master's degree","ain":"Risk modelling tools are AI-assisted, but judgment and regulation roles are safe"},"j_bankpo":{"salary":"Basic ₹48,480/month · gross ₹65-85K/month approx (SBI CTC ~₹22L Mumbai)","exam":"IBPS PO / SBI PO (Prelims + Mains + Interview/GD)","duration":"~1 year cycle + 2 years probation","elig":"Any graduate · age 20-30 (IBPS) / 21-30 (SBI)","growth":"Scale I → Branch Manager → AGM → GM → MD (faster with JAIIB/CAIIB)","ain":"Branch banking is going digital, but officer roles evolve, they don't end","coach":"Medium — ₹15-40K; the most common self-study exam","comp":"IBPS PO ~1%; SBI PO <0.5%; STABLE","ladder":"PO (JMGS-I) → Manager (MMGS-II) → Sr Manager (MMGS-III) → Chief Manager (SMGS-IV) → AGM → DGM → GM (normal 5 yrs/scale, fast-track 3 yrs; GM ~31-34 yrs)"},"j_chsl_ldc":{"salary":"LDC Level-2 ₹19,900-63,200 · DEO Level-4/5 ₹25,500+ · in-hand ₹22-30K (approx)","exam":"SSC CHSL (ssc.gov.in) — Tier-I + Tier-II CBT, typing/DEST included · CHSL 2026: 2,536 posts","duration":"~1 year preparation cycle after 12th","elig":"12th pass any stream (some ministries' DEO needs Science+Maths) · age 18-27","growth":"LDC → UDC → Section Officer (dept exams) · officer level via CGL after graduation","ain":"Clerical typing is getting automated — skill tests + judgment-based work is safe"},"j_steno_ssc":{"salary":"Grade C ~Level-7, D ~Level-4 (verify) · in-hand ₹28-40K (approx)","exam":"SSC Stenographer — CBT + dictation skill test (Grade C: 100 wpm, Grade D: 80 wpm)","duration":"6-12 months steno training + exam after 12th","elig":"12th pass · age 18-30 (C) / 18-27 (D)","growth":"Steno → Senior Steno → Private Secretary — work with officers, fast promotion track","ain":"Speech-to-text is growing, but government steno posts are still strong"},"j_ntpc":{"salary":"Level-2 to Level-6 by post — Station Master Level-6 ₹35,400 · in-hand ₹25-45K (approx)","exam":"RRB CENs (graduate + UG separate) — CBT-1 + CBT-2 + CBAT (Station Master)","duration":"~1 year cycle after 12th/graduation","elig":"UG posts: 12th · Graduate posts: bachelor's · age 18-30/33","growth":"Station Master → senior traffic roles · clerk → railway administration","ain":"Operations + safety roles — human requirement"},"j_lekhpal":{"salary":"Level-3 ₹21,700-69,100 · in-hand ₹22-28K (approx)","exam":"UPSSSC PET (common prelims gate) → Mains (Lekhpal 2025: 7,994 posts)","duration":"PET + Mains cycle of 1-1.5 years after 12th","elig":"12th pass + CCC (NIELIT) · age 18-40 · state recruitment rules apply","growth":"Lekhpal → senior clerk → revenue officer track (state dept exams)","ain":"Field revenue work — ground reality is human"},"j_lawyer":{"salary":"Law firm: ₹4–8 LPA (tier-1 firms 12–18 LPA) → Judiciary (Civil Judge): basic ₹77,840/month, in-hand ₹85K–1.05L","exam":"CLAT/AILET → LLB → Bar Council enrolment (+AIBE). Judiciary: state PCS-J (Prelims + Mains + Interview)","duration":"5-year integrated BA LLB (or 3-year LLB after graduation). To become a judge: LLB + practice (see below) + PCS-J","elig":"12th any stream + CLAT. Civil Judge: LLB + Bar enrolment; age 21–35 (state-wise varies)","growth":"Associate → Partner (firm) | Civil Judge (Jr Div) → Sr Div → District Judge → High Court Judge. NOTE (2025-26 rule change): the Supreme Court made 3 years of practice mandatory in May 2025; an August 2026 judgement reduced it to 1 year — fresh graduates can also apply until March 31, 2027 (transition window)","ain":"court advocacy + judgment stay human","coach":"CLAT Medium — ₹50K-1.5L; self-study possible","comp":"CLAT ~75K for ~3.5K top-NLU seats (~5%); STABLE","ladder":"Associate → Partner (firm) | Civil Judge (Jr Div) → Sr Div → District Judge → High Court Judge"},"j_corplaw":{"salary":"Tier-1 firms: ₹12–18 LPA start → partner ₹50L–2Cr","exam":"CLAT → NLU → firm recruitment (no further exam)","duration":"5-year BA LLB","elig":"12th any stream + CLAT","growth":"Associate → senior associate → partner. M&A, tax, arbitration specialization pays the top","ain":"negotiation + drafting nuance stay human"},"j_designer":{"salary":"₹4–8 LPA → senior 12–25 LPA","exam":"NIFT exam, NID DAT, UCEED (IIT design)","duration":"3–4 years (B.Des)","elig":"12th any stream — portfolio + creative aptitude","growth":"Designer → senior → studio head. UX design in IT companies too (high pay).","ain":"AI design tools — top creatives are safe, average ones need to upskill"},"j_ux":{"salary":"₹4–8 LPA start → senior ₹12–20 LPA+ (tech companies)","exam":"No exam — the portfolio is the selection. Both B.Des and UX certificate courses work","duration":"3–4 year degree or 6–12 month bootcamp + portfolio","elig":"12th any stream","growth":"UX designer → senior → lead → head of design. Arts students have a natural advantage in product companies like Swiggy, Zerodha, PhonePe (empathy + user understanding)","ain":"AI is making wireframes — user research and empathy are the human edge"},"j_journalist":{"salary":"₹3–6 LPA → digital media growth is fast","exam":"IIMC, XIC, DU entrances (CUET for UG)","duration":"3 years (or PG diploma)","elig":"12th any stream","growth":"Reporter → senior journalist → editor. Big scope in the digital content/YouTube industry too.","ain":"basic reporting is done by AI — analysis + field reporting stay human","coach":"IIMC Medium — ₹20-50K; self-study works","ladder":"Reporter → Correspondent → Editor"},"j_psych":{"salary":"Counsellor ₹3–6 LPA → Clinical Psychologist (M.Phil + RCI licence) ₹6–12 LPA; private practice ₹1L+/month","exam":"CUET-UG → MA/M.Sc Psychology (2 years) → RCI licence: M.Phil Clinical Psychology had its last intake in 2025-26, now a new ladder — 1-year PG Diploma (Clinical Psychologist Associate), 2-year M.Psy/MA Clinical Psychology (full registration), or 4-year Psy.D; registration in the Central Rehabilitation Register (CRR)","duration":"BA 3 + MA 2 + M.Phil 2 = 7-year clinical route","elig":"12th any stream","growth":"Counsellor at ₹2.2-3.6 LPA after B.Sc → ₹4-7 LPA after Master's → licensed Clinical Psychologist ₹4.7 LPA entry, ₹8-15 LPA mid-level, private practice ₹25 LPA+ (session fee ₹1.5-5K)","ain":"empathy is the core — India has a shortage of professionals"},"j_ias":{"salary":"₹56,100/month start (7th CPC Level 10) → ₹2,50,000/month (Cabinet Secretary) + DA/HRA/TA + bungalow, car, staff, security","exam":"UPSC CSE: Prelims (GS + CSAT) → Mains (9 papers) → Interview (275 marks). ~933 vacancies/year, success rate ~0.2%","duration":"Degree (3-4 yr) + 1-2 years preparation + 2 yr LBSNAA Mussoorie training","elig":"Graduate in any stream; age 21–32 (Gen), 21–35 (OBC), 21–37 (SC/ST); 6 attempts (Gen)","growth":"SDM/DSP → DM/Collector → Secretary to Govt of India. IPS branch: ASP → SP (commands 1,000-5,000 police) → DIG → IG → ADGP → DGP; SVPNPA Hyderabad training, deputation to CBI/IB/RAW/NIA possible","ain":"governance decisions + accountability stay human","coach":"HIGH — ₹1.5-2.5L (Delhi/online full); many toppers self-study (standard books + test series ₹10-20K)","comp":"UPSC CSE ~10-13 lakh apply, ~1,000 selected (~0.01%); STABLE","ladder":"SDM/DC → ADM → DM → Deputy Secy → Joint Secy → Principal Secy → Chief Secretary. PCS→IAS promotion: 33.33% quota, min 8 yrs service (practically ~2 decades)"},"j_hotel":{"salary":"₹3–5 LPA → GM level 15–20 LPA","exam":"NCHM JEE (IHM admission)","duration":"3-year B.Sc HM","elig":"12th any stream","growth":"Trainee → dept manager → GM hotel. Cruise lines, airlines, event companies too.","ain":"service roles are AI-assisted — hospitality stays human","ladder":"Management Trainee → Executive → Dept Manager → GM (15-20 yrs typical)"},"j_teacher":{"salary":"PRT ₹35,400 basic (₹48–52K in-hand) · TGT ₹44,900 (₹55–60K) · PGT ₹47,600 (₹60–65K) + DA/HRA","exam":"CTET Paper 1 (PRT) / Paper 2 (TGT) — CBSE, twice a year, lifetime validity. Then KVS/NVS/DSSSB/state Super-TET recruitment","duration":"D.El.Ed 2 years (PRT after 12th) or graduation + B.Ed 2 years (TGT)","elig":"PRT: 12th (any stream) + D.El.Ed; TGT: graduate (BA/B.Sc/B.Com — any) + B.Ed + CTET-2; PGT: PG + B.Ed","growth":"PRT → TGT → PGT → Vice Principal → Principal. Summer/winter vacations + pension + 7th CPC. Private schools start at ₹20–35K, government selection takes a 12–24 month cycle — you should fill 3-5 forms in parallel through the year","ain":"AI cannot do the classroom + emotional connection","coach":"CTET ~₹10-30K; KVS/NVS prep Medium","comp":"KVS/NVS — lakhs for a few thousand (<1%); SPORADIC (cycle-based)","ladder":"KVS: PRT → TGT (LDE, 5 yrs) → PGT (LDE, 3 yrs) → Vice-Principal (LDCE, 5 yrs) → Principal (LDE, 3 yrs, Level 12 ₹78,800-2,09,200) → Commissioner"},"j_flexpert":{"salary":"₹5–12 LPA → UN/embassy interpreter ₹15L+ → freelance translation premium rates","exam":"No national exam — JLPT (Japanese), DELF (French), TestDaF (German), TOPIK (Korean) levels","duration":"BA (Hons) language 3 years or 6–12 month intensive cert","elig":"12th any stream","growth":"MNC translator → interpreter → diplomat/UN track. Japanese/Korean demand is exploding in India (companies shifting from China). Japan jobs: ₹25–40 LPA abroad","ain":"translation is being done by AI — interpretation/cultural nuance is the human edge"},"j_vfx":{"salary":"Fresher ₹2–4 LPA → 3–5 years exp ₹8–15 LPA → VFX supervisor ₹25–40 LPA","exam":"Institute tests + portfolio (the SHOWREEL matters more than the degree)","duration":"3-year B.Sc Animation/B.Des (or 1-year diploma)","elig":"12th any stream (some ask 50%)","growth":"Junior artist → senior → studio lead → supervisor. India is a global VFX outsourcing hub (Baahubali, RRR, Hollywood work). Gaming industry also 30%+ growth","ain":"AI tools are giving speed — top creatives are safe, average ones will have to upskill"},"j_artist":{"salary":"Fresher ₹2-3 LPA · Graphic Designer ~₹3 LPA, Animator ~₹4 LPA, Art Director ~₹7 LPA (avg, grows with portfolio)","exam":"CUET-UG, MAH-AAC-CET, BHU UET, Jamia entrance, DU College of Art (50% CUET + 50% practical)","duration":"BFA 3-4 years","elig":"12th any stream, 45-50% (English subject needed for MAH-AAC-CET)","growth":"After MFA/M.Des: ad agencies, studios, publishing; up to Art Director · Applied Art (design) route: Graphic ₹3-5 LPA, UI/UX ₹5-9 LPA (best-paying BFA track), Art Director (5-10 yrs) ₹8-15 LPA — digital skills (Figma/Adobe) multiply market value","ain":"AI can generate basic art, but original creative direction and client work stay with humans"},"j_performer":{"salary":"Entry ₹2-5 LPA · Dance Teacher ~₹4 LPA, Theatre Director ~₹4 LPA, Choreographer ~₹5 LPA (avg); ₹6-15 LPA from steady gigs + teaching","exam":"CUET-UG (Performing Arts domain), BHU UET + practical/viva","duration":"BPA 3-4 years (6-8 semesters)","elig":"12th any stream ~40-50%, prior training in the chosen art form preferred","growth":"After MPA, NSD (theatre PG), FTII (film PG): director/choreographer or professor","reality_note":"Income is gig-based and portfolio-driven — a fixed monthly salary is rare","ain":"AI cannot replace live performance and stage work"},"j_socwork":{"salary":"Fresher ₹2.5-4 LPA (₹10-20K/month) · corporate CSR ₹3-6 LPA · government welfare officer ₹25-45K/month","exam":"CUET-UG or Class 12 merit (IGNOU distance has no entrance)","duration":"BSW 3 years + 300-400 hours of NGO/hospital fieldwork","elig":"12th any stream (no stream mandate), ~45-50%","growth":"After MSW: international NGOs (UNICEF/WHO tier) ₹60K-1.2L/month (3-5 years experience)","reality_note":"Entry-level NGO pay is really low — this is an important counselling point","ain":"Field-level trust and human connection work cannot be replaced by AI"},"j_socwork_msw":{"salary":"Fresher ₹15-35K/month · int'l NGOs ₹60K-1.2L/month in 3-5 years · corporate CSR up to ₹10-20 LPA","exam":"TISSNET + GD-PI, CUET-PG (TISS also runs a 5-yr integrated BSW+MSW)","duration":"MSW 2 years","elig":"Any graduate (BSW is not mandatory)","growth":"UNICEF/WHO/Oxfam tier, corporate CSR, government welfare officer, PhD Social Work","ain":"Human services and community trust work is difficult for AI"},"j_tourmgr":{"salary":"Tour guide ₹2-4 LPA, travel agent ₹2-5 LPA, tourism manager ₹4-8 LPA · IITTM avg package ~₹6.2 LPA","exam":"CUET-UG or IITTM's own admission test (CAT/MAT/CMAT for MBA-TTM)","duration":"BBA (Travel & Tourism) 3 years, 140 credits + summer internship","elig":"12th any stream (some courses ask for 45-55%)","growth":"After MBA (TTM): MakeMyTrip, IRCTC, Air India, hotels, cruise lines; MICE/adventure niches","ain":"Basic booking/agent work is shifting to AI portals — experience design and operations roles are safe"},"j_eventmgr":{"salary":"Coordinator ₹2-3.5 LPA · event planner ₹2.5-4 LPA · manager ₹3.5-6 LPA (avg ~₹4.7 LPA) · director ₹10-25 LPA at 8+ years","exam":"Mostly direct/merit admission (NAEMD, NIEM, AAFT's GET test)","duration":"Certificate 6-12 months · diploma 1 year · BA/BBA 3 years","elig":"12th any stream ~45-55%","growth":"Weddings (destination weddings boom), corporate MICE, concerts; opening your own agency at senior level is common","ain":"On-ground execution and vendor networking doesn't happen through AI"},"j_librarian":{"salary":"Fresher ₹1.8-2 LPA (~₹15K/month) · Railway Librarian (RRB CEN 07/2024) Level-6, in-hand ~₹50-55K/month","exam":"Mostly merit on graduation marks (some universities CUET-PG/own test)","duration":"BLIS 1 year (MLISc +1 year)","elig":"Any graduate ~50% (not possible directly after 12th)","growth":"After MLISc: Deputy Librarian, university/school librarian (KVS/DSSSB), digital asset manager","ain":"Cataloguing is getting automated — digital asset management and curation roles are more sustainable"},"j_archaeo":{"salary":"Assistant Archaeologist (Group B) Level-6 ₹35,400-1,12,400 · ASI Young Archaeologist ₹40K/month (contractual)","exam":"ASI PGDA: written exam + viva (asi.nic.in, advertisement in Employment News)","duration":"BA 3 + MA 2 + PGDA 1-2 years","elig":"MA in Ancient/Medieval History, Archaeology, Anthropology, classical languages or Geology, ≥55%","growth":"ASI, museums, universities; Epigraphist, Numismatist, Curator (₹2-6 LPA museums/NGOs)","ain":"Field excavation and heritage work is physical and research-driven"},"j_econ_ba":{"salary":"Strong grads ₹5 LPA+ (highest-earning pure-BA subject) · research/policy roles ₹3-10 LPA","exam":"CUET-UG (CUET-PG for PG, DSE-type MA route)","duration":"BA 3 years (better roles after MA)","elig":"12th any stream (some colleges prefer Economics in 12th)","growth":"MA (DSE), RBI/policy roles, risk advisory, banking/SSC exams","ain":"AI can do the data crunching, but interpretation and policy judgement remain with humans"},"j_asstprof":{"salary":"₹57,700/month entry (UGC 7th CPC scale)","exam":"CUET-PG/DU-JNU-BHU entrance, then UGC NET","duration":"BA 3 + MA 2 years","elig":"~50% marks in MA (many universities accept any BA)","growth":"PhD, professor track, research roles","ain":"Teaching and research mentorship is human relationship work","coach":"UGC-NET Medium; self-study common","comp":"UGC-NET — moderate pass; faculty jobs competitive","ladder":"Assistant Prof (NET/PhD) → Associate Prof → Professor (UGC 2018 API)"},"j_policy":{"salary":"Entry ₹3-5 LPA · research/policy roles ₹3-10 LPA","exam":"CUET-PG or university MA entrance","duration":"MA 2 years","elig":"MA after any BA (Political Science/Sociology type subjects common)","growth":"Think-tanks, public policy, NGOs, government research","ain":"AI can draft and summarise data, but judgement and field insight are human"},"j_teach_itep":{"salary":"Govt school TGT-scale ₹44,900 basic (₹55-60K in-hand) + DA/HRA · pvt schools start at ₹20-35K (approx)","exam":"NCET (National Common Entrance Test, NTA) → institute counselling (DU/NITT portals)","duration":"4-year dual-major (Education + subject) — no separate B.Ed needed","elig":"12th pass ~50% (NCTE norms) — Science stream for B.Sc. B.Ed. Secondary; arts for B.A. B.Ed.","growth":"Under NEP 2020, standalone B.Ed is slowly being replaced by ITEP-type integrated programmes — early mover advantage. From 2026-27 live at top institutes like DU (Miranda House) and NIT Trichy","ain":"Teaching + mentorship is human — AI assists, does not replace"},"j_peteach":{"salary":"Govt school PE teacher ₹35,400-44,900 basic scale · academies/clubs ₹2.5-6 LPA · pvt schools ₹20-40K/month (approx)","exam":"CUET-UG (B.Sc PE, HE&S — like DU's IGIPESS) or CUET-PG after graduation + fitness/sports trials (B.P.Ed)","duration":"B.Sc PE 3-4 years (after 12th) · B.P.Ed 2 years (after graduation)","elig":"12th pass (B.Sc PE); for B.P.Ed graduation + sports participation norms (institute-wise bands)","growth":"PE teacher → Head of Sports → Director PE · SAI/academy/pro-club coach route · higher roles with M.P.Ed","ain":"Physical training + coaching is human-centric"},"j_dpconst":{"salary":"Level-3 ₹21,700-69,100 · in-hand ₹25-32K (approx)","exam":"SSC-conducted CBT + PE&MT (race/long jump/high jump) + medical","duration":"~1 year selection cycle after 12th","elig":"12th pass · male: LMV licence up to PE&MT · age 18-25 · height M 170/F 157 cm","growth":"Constable → Head Constable → ASI (dept exams) → SI (CPO after graduation)","ain":"Ground duty — human policing"},"j_cpo_si":{"salary":"Level-6 ₹35,400-1,12,400 · in-hand ₹55-65K (approx)","exam":"SSC CPO — Paper-I + PST/PET + Paper-II + medical · 2025: 3,073 posts","duration":"~1 year cycle after graduation","elig":"Graduate · age 20-25 · height M 170/F 157 cm · male DP-SI: LMV licence","growth":"SI → Inspector → officer track (CAPF/Delhi Police)","ain":"Uniformed ground duty — human"},"j_state_si":{"salary":"Approx Level-6 equivalent · in-hand ₹45-55K (approx, verify)","exam":"UPPRPB (UP SI 2025: 4,543 posts) / BPSSC-type state boards — written + PST/PET","duration":"~1 year cycle after graduation","elig":"Graduate · age 21-28 (relaxations state-wise) · verify physical standards from the official PDF","growth":"SI → Inspector → DSP → SP track","ain":"Field policing — human"},"j_acio":{"salary":"Level-7 ₹44,900-1,42,400 · in-hand ₹55-70K (approx)","exam":"IB ACIO (mha.gov.in) — Tier-I CBT + Tier-II descriptive + interview · 2025: 3,717 posts","duration":"~1 year cycle after graduation (recruitment irregular — 2017, 2023, 2025)","elig":"Graduate any stream · age 18-27 · 2025 notice: PwBD not eligible","growth":"ACIO → DCIO → IB officer track — internal security","ain":"Intelligence analysis is human-judgment heavy"},"j_courtclerk":{"salary":"GP 2,000/2,800 approx Level-3/4 · in-hand ₹22-30K (approx)","exam":"HC centralized recruitment (Allahabad HC-type): written + typing/steno test","duration":"Typing training + exam cycle after 12th","elig":"Clerk: 12th + CCC · Steno Gr-III: graduation + shorthand 80/100 wpm · age 18-40","growth":"Junior Assistant → Reader → senior clerk · adding an LLB also opens a legal career","ain":"Court records are going digital, but staff posts continue"},"j_electrician":{"salary":"₹15–25k/month → Gulf 60–80k/month","exam":"ITI entrance → NAC/RYK apprenticeship","duration":"2 years ITI + 1 yr NCVT apprenticeship","elig":"10th pass","growth":"Technician → contractor (own electrical business) → govt lineman exams (state electricity boards).","ain":"Physical electrical work is hard for AI to automate"},"j_fitter":{"salary":"₹14–22k/month → Gulf/industrial 30–60k","exam":"ITI entrance → NATS apprenticeship","duration":"2 years + 1 yr apprenticeship","elig":"10th pass","growth":"Fitter → supervisor → own workshop/garage. Manufacturing units are everywhere.","ain":"hands-on machinery — physical trades are safe"},"j_copa":{"salary":"₹12–18K/month start → with better skills, web dev ₹3–6 LPA","exam":"ITI entrance (AITT exam)","duration":"1 year","elig":"10th pass","growth":"COPA → freelancing web projects → full developer (through self-study people reach 6–10 LPA). Speedy digital-skill entry point","ain":"data entry/basic ops are getting automated — upskill immediately (web dev/data)"},"j_weldturn":{"salary":"₹12-20K entry (welder ₹13-20K, CNC operator ₹12-18K) · specialised welders up to ₹1 lakh/month with experience (approx)","exam":"Admission through state counselling on 10th marks · AITT (NCVT) at the end of the course","duration":"1-2 years trade-wise","elig":"10th pass · for welder, 8th pass also accepted","growth":"Specialised welding like 6G → shipyard/gulf jobs · polytechnic lateral entry","ain":"Welding robots are entering factories, but repair, fabrication and site welding are human-heavy"},"j_mmv":{"salary":"₹12-18K entry · growth in a dealership with experience","exam":"State ITI counselling (10th marks) · AITT","duration":"1-2 years","elig":"10th pass","growth":"Polytechnic automobile lateral entry · EV repair specialisation","ain":"Diagnostics is becoming software-based, but hands-on repair is manual work"},"j_rac":{"salary":"₹10-18K · demand and earnings are high in the summer season","exam":"State ITI counselling · AITT","duration":"1-2 years","elig":"10th pass","growth":"Own AC repair business · HVAC industry jobs","ain":"Home/office site repair and installation is hard to automate"},"j_elecwire":{"salary":"₹10-18K entry","exam":"State ITI counselling · AITT","duration":"6 months-2 years trade-wise","elig":"10th pass (for wireman, 8th also accepted)","growth":"NAPS apprenticeship (BSNL/electronics firms) · PSU technician posts","ain":"Assembly lines are getting automated, but there is demand in field repair and maintenance"},"j_draught":{"salary":"₹12-18K · architecture and engineering firms","exam":"State ITI counselling · AITT","duration":"2 years","elig":"10th pass (Science + Maths required in some states)","growth":"Polytechnic civil/mechanical lateral entry → JE track","ain":"Basic drafting is being done by AI/automation, but site-grounded detail is human work"},"j_survey":{"salary":"₹10-25K approx — depending on trade and city","exam":"State ITI counselling · AITT","duration":"2 years","elig":"10th pass (Science + Maths in some states)","growth":"Construction/infrastructure projects · add CAD-GIS skills","ain":"Drone/GPS survey is advancing, but field verification is necessary"},"j_steno":{"salary":"₹15-25K — courts and govt offices","exam":"Govt stenographer exams — a skill test is held, no degree needed","duration":"1 year","elig":"10th pass","growth":"Court/state secretariat steno exams · senior PA roles","ain":"Voice-to-text is improving, but court and official-language posts are still skill-tested"},"j_sew":{"salary":"₹8-15K in a job · your own shop is a different level","exam":"State ITI counselling · AITT","duration":"1 year","elig":"8th-10th pass","growth":"Own tailoring shop (MUDRA loan route) · fashion diploma later","ain":"Custom fit and repairs are local work — automation risk low"},"j_hsi":{"salary":"₹10-25K approx — municipalities and health depts (trade/city-wise)","exam":"State ITI counselling · AITT · then municipal/health recruitments","duration":"Trade-wise — confirm in the prospectus","elig":"10th pass","growth":"Municipal corporation / health dept posts","ain":"Field inspection and enforcement is a human role"},"j_plumber":{"salary":"₹10-25K approx — depending on trade and city","exam":"State ITI counselling · AITT","duration":"Trade-wise — confirm in the prospectus","elig":"10th pass","growth":"Construction projects · own plumbing business","ain":"Site repair and installation — out of reach of automation"},"j_naps":{"salary":"₹7-15K stipend during training · typically ₹15-25K after completion","exam":"Mostly no entrance exam — merit selection on 10th + ITI marks (apprenticeshipindia.gov.in)","duration":"6 months-2 years (Designated Trades)","elig":"ITI pass (NTC holder)","growth":"National Apprenticeship Certificate (NAC) — a strong signal in technician recruitment; some PSUs absorb strong apprentices","reality_note":"NAC does not give a job guarantee, but it has higher value in PSU technician recruitment","ain":"It is a training route — the automation risk ahead depends on which trade you go into"},"j_cits":{"salary":"₹18-30K approx (band of govt posts) — verify the exact instructor scale in the notification","exam":"CITS selection based on NTC/NAC + experience","duration":"1 year (NSTI)","elig":"NTC/NAC with experience","growth":"National Craft Instructor Certificate (NCIC) → ITI instructor recruitment (teaching job)","ain":"A human instructor is necessary in hands-on trade training"},"j_alp":{"salary":"Pay Level 2 · ₹19,900 basic","exam":"RRB CBT → document verification → medical","duration":"Recruitment route — training on joining","elig":"10th + ITI specified trades (or diploma) · age 18-28","growth":"Seniority-based departmental promotions within Railways","ain":"Automatic trains may come in the future, but for now the driver-cum-attendant role is human"},"j_itsup":{"salary":"₹2–3.5 LPA → 4–8 LPA after lateral B.Tech","exam":"Polytechnic CET (state) → LEET for B.Tech entry","duration":"3-year diploma (+2 B.Tech lateral)","elig":"10th pass, state CET rank","growth":"IT support → developer, or B.Tech lateral → full engineering career. It is the right plan for budget-conscious students.","ain":"L1 support is automated — specialise in cloud/security"},"j_junengg":{"salary":"₹2.8–4 LPA → SSC JE govt 7–9 LPA","exam":"State poly CET → SSC JE / state JE exams","duration":"3-year diploma","elig":"10th pass + CET","growth":"Junior Engineer → AE (assistant engineer, after degree) → department head. The B.Tech lateral option stays open.","ain":"site + supervision are human","coach":"Medium — ₹15-40K","ladder":"JE → AE → Executive Engineer → SE → Chief Engineer"},"j_pol_etc":{"salary":"₹15-35K (CS/IT diploma at the top of this band) · JE-level govt posts ₹35-50K","exam":"POLYCET (AP/TS), JEECUP (UP), Bihar DCECE, Delhi CET, JEXPO (WB) · 10th merit counselling in Maharashtra/Kerala","duration":"3 years (6 semesters)","elig":"Science + Maths in 10th · 35-40% (state-wise)","growth":"B.Tech lateral (LEET/JELET) · SSC JE · NATS apprenticeship (diploma technician, stipend ~₹10,900)","ain":"Basic test roles are getting automated, but telecom rollout and maintenance are human"},"j_pol_auto":{"salary":"₹15-35K · JE-level govt posts ₹35-50K","exam":"State polytechnic exams / 10th merit counselling","duration":"3 years","elig":"10th Science + Maths · 35-40% state-wise","growth":"B.Tech lateral · dealership/OEM service ladder · EV transition","ain":"The EV shift is changing skills — service roles will remain"},"j_pol_proc":{"salary":"₹15-35K — depends on industry and region · JE-level govt posts ₹35-50K","exam":"State polytechnic exams / 10th merit counselling","duration":"3 years (Tool & Die: +1 year in-plant)","elig":"10th Science + Maths · 35-40% state-wise","growth":"B.Tech lateral · SSC JE (branch-wise) · NATS apprenticeship (stipend ~₹10,900)","reality_note":"Jobs in these branches depend on the region — mining belts, textile hubs, tool-room clusters","ain":"In automated plants, monitoring roles are shifting — the supervisor remains human"},"j_btle":{"salary":"₹2.5-4.5 LPA typical — average colleges","exam":"LEET/OCET (Haryana), LEEP (Rajasthan), JELET (WB), DCET (Karnataka), TN lateral, Maharashtra DSE — state-wise","duration":"3 years — saves one year vs 12th → B.Tech","elig":"3-year diploma in any branch with 45% (reserved 40%) · lateral seats ~10% cap · age cap in some states (WB JELET 27)","growth":"Graduate engineer → GATE / PSU / campus placements","ain":"Core engineering roles are changing with AI, but the degree + practical skills decide"},"j_rrbje":{"salary":"Level-6 ₹35,400-1,12,400 · in-hand ₹45-55K (approx)","exam":"RRB JE CEN 05/2025 — CBT-1 + CBT-2 (approx 2,570 posts)","duration":"~1 year cycle after Diploma/B.Tech","elig":"3-year diploma (relevant branch) or B.E./B.Tech · JE-IT: CS quals · awaiting-result NOT eligible · age 18-33","growth":"JE → SSE → railway engineering ladder · SSC JE + state JE are in the same family","ain":"Engineering supervision + field roles — automation-assisted, not replaced"},"j_agni":{"salary":"Yearly package ₹30,000 → ₹33,000 → ₹36,500 → ₹40,000/month (70% in hand, 30% Seva Nidhi) · life insurance ₹48 lakh · no pension","exam":"Agniveer CEE (written) + physical rally + medical","duration":"4 years service","elig":"GD: 45% in 10th (5 subjects, 33% in each subject) · Tradesman (10th): simple pass 33% per subject · Tradesman (8th) route also · Technical/Clerk: 12th (Technical possible from 10th + 2-year ITI in listed trades)","growth":"After 4 years: up to 25% on merit into the regular cadre · Seva Nidhi ~₹10.04 lakh tax-free · many states have a 10% quota for ex-Agniveers in police · or the civilian market at age 22-23","ain":"combat + physical — human","coach":"Medium — ₹15-40K; physical prep is self-driven","comp":"Agniveer lakh+ per cycle, low %; annual intake (4-yr model)","ladder":"4 yrs service → up to 25% to regular cadre (merit) → or civilian career (ex-Agniveer quota)"},"j_const":{"salary":"₹22,000–32,000/month + allowances","exam":"State police constable / SSC GD — written + physical (PET/PST)","duration":"Selection process ~1 year","elig":"10th/12th pass (state-wise), age 18–25","growth":
