name: One-shot patch - project-ideas label

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-pilabel-20261101.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/data/teachers.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(teachers): project-ideas card label matches where its link goes (Maths Lab)"
            git push
          fi
