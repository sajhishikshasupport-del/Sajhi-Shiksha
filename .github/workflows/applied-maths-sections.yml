name: Applied Maths sections
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python frontend/scripts/applied-maths-sections.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/features/teachers/components/TeacherShared.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: separate Class 11/12 Applied Maths sections in question papers & question banks (CEO request)"
            git push
          fi
