name: One-shot patch - SEO (sitemap /for-students + lastmod)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-seo-20261016.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/scripts/generate-route-meta.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(seo): sitemap - add /for-students + <lastmod> (REQ-1013-02, REQ-1015-02)"
            git push
          fi
