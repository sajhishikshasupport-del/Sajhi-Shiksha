name: One-shot patch - grid view external buttons as real links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-links2-20261023.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/components/ResourceCard/ResourceCard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(links): grid view YouTube/website buttons use real <a> links (mobile popups were blocked)"
            git push
          fi
