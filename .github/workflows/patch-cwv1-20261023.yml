name: One-shot patch - CWV step 1 (data out of the bundle)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-cwv1-20261023.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/components/PageIntro.tsx frontend/src/features/teachers/components/TeacherShared.tsx frontend/src/lib/resourceAggregator.ts frontend/src/features/viewer/components/ResourceViewPage.tsx "frontend/src/routes/view.$id.tsx" frontend/public/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "perf(cwv): document descriptions + page intros are fetched at runtime instead of being bundled"
            git push
          fi
