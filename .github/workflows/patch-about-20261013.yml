name: One-shot patch - About page (remove Arattai) + misc CEO fixes 13 Oct

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-about-20261013.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(about): remove Arattai card; channel link + email fix; career default English; students NCERT lab manuals"
            git push
          fi
