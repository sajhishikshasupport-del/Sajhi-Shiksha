name: One-shot patch - leaf url (?leaf= for leaf-level ids)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-leafurl-20261118.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/lib/resourceAggregator.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(view): leaf-level subCards redirect with ?leaf= so the leaf view opens"
            git push
          fi
