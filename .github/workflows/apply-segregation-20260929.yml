name: Apply pending content changes (2026-09-29)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch (sync + segregation)
        run: python frontend/scripts/apply-segregation-20260929.py
