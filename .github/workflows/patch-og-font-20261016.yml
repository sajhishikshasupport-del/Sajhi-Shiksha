name: One-shot patch - OG Devanagari font fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-og-font-20261016.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/scripts/generate-og-images.py .github/workflows/generate-og-images.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(og): install Devanagari font in the OG workflow + resolve F_DEVA dynamically (Hindi cards were silently skipped)"
            git push
          fi
