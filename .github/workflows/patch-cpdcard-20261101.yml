name: One-shot patch - CPD card on Teachers' Corner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-cpdcard-20261101.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/routes/for-teachers.index.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(teachers): CPD Certificate Generator card on the Teachers' Corner landing"
            git push
          fi
