name: One-shot patch - fix broken Drive embeds on /view pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-embed-20261023.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/lib/utils.ts frontend/src/components/IframeViewer/IframeViewer.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(view): stop embedding Drive folders / YouTube links (they showed a 500 error); show a clear fallback instead"
            git push
          fi
