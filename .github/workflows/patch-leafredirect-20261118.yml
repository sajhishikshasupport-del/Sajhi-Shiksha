name: One-shot patch - leaf id redirect on /view

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-leafredirect-20261118.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/lib/resourceAggregator.ts 'frontend/src/routes/view.$id.tsx'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(view): leaf/subCard ids redirect to their section page instead of a document page"
            git push
          fi
