name: Deploy CPD certificate app (from the handoff file in Drive)

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Drive file id of cpd-app-vX.Y.html"
        required: true
        default: "1ATFv7Q9YpIAUAa3Yic6VSioE0y9e296J"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the app from Drive
        run: |
          mkdir -p frontend/public/cpd-certificate
          curl -sL "https://drive.google.com/uc?export=download&id=${{ inputs.file_id }}" -o /tmp/cpd.html
          echo "downloaded bytes: $(wc -c < /tmp/cpd.html)"
          grep -q "script.google.com" /tmp/cpd.html || { echo "ERROR: download does not look like the app"; exit 1; }
          grep -q "noindex" /tmp/cpd.html || { echo "ERROR: noindex meta missing"; exit 1; }
          echo "version markers: $(grep -o 'v1\.[0-9]' /tmp/cpd.html | sort -u | tr '\n' ' ')"

      - name: Inject social/OG meta tags
        run: |
          python3 - <<'PY'
          html = open('/tmp/cpd.html', encoding='utf-8').read()
          tags = (
              '<meta name="description" content="Free CPD certificate generator for Kendriya Vidyalaya schools - fill school and staff details and download the whole staff certificates in one PDF.">\n'
              '<meta property="og:type" content="website">\n'
              '<meta property="og:site_name" content="Sajhi Shiksha">\n'
              '<meta property="og:title" content="CPD Certificate Generator | Sajhi Shiksha">\n'
              '<meta property="og:description" content="School ke staff ke CPD certificates ek hi PDF me - free tool.">\n'
              '<meta property="og:url" content="https://www.sajhishiksha.in/cpd-certificate/">\n'
              '<meta property="og:image" content="https://www.sajhishiksha.in/images/og-cpd-certificate.png">\n'
              '<meta property="og:image:width" content="1200">\n'
              '<meta property="og:image:height" content="630">\n'
              '<meta name="twitter:card" content="summary_large_image">\n'
              '<meta name="twitter:title" content="CPD Certificate Generator | Sajhi Shiksha">\n'
              '<meta name="twitter:image" content="https://www.sajhishiksha.in/images/og-cpd-certificate.png">\n'
              '<link rel="icon" href="https://www.sajhishiksha.in/favicon.svg">\n'
          )
          if 'og:title' in html:
              print('OG tags already present - skipping')
          else:
              marker = '<meta charset="utf-8">'
              assert marker in html, 'charset meta not found'
              html = html.replace(marker, marker + '\n' + tags, 1)
              open('/tmp/cpd.html', 'w', encoding='utf-8').write(html)
              print('OG tags injected')
          PY
          cp /tmp/cpd.html frontend/public/cpd-certificate/index.html

      - name: Generate the OG image with the site's own card design
        run: |
          pip install --quiet pillow
          mkdir -p frontend/public/images
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('gen', 'frontend/scripts/generate-og-images.py')
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)
          img = gen.draw_card('#FFE066',
                              'CPD Certificate Generator',
                              'Staff CPD Certificates in One PDF',
                              'Free Tool - Kendriya Vidyalaya Schools')
          img.save('frontend/public/images/og-cpd-certificate.png', 'PNG', optimize=True)
          print('OG image written')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/public/cpd-certificate/index.html frontend/public/images/og-cpd-certificate.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(cpd): deploy CPD certificate app (from handoff file ${{ inputs.file_id }})"
            git push
          fi
