name: One-shot patch - cookie banner overlap + Hindi toggle font

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-ux-20261101.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/components/CookieConsent/CookieConsent.tsx frontend/src/features/career/components/CareerLanguageToggle.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(ux): cookie banner no longer covers content; Hindi option in the career language toggle renders (Devanagari fallback)"
            git push
          fi
