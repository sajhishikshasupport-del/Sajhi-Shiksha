name: One-shot patch - real <a> links + Drive folder URL fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 frontend/scripts/patch-links-20261023.py

      - name: Commit and push if changed
        run: |
          git config user.name "sajhishikshasupport-del"
          git config user.email "sajhishiksha@gmail.com"
          git add frontend/src/components/ResourceCard/ResourceCard.tsx frontend/src/components/IframeViewer/IframeViewer.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(links): use real <a> tags for external links (mobile popups were blocked) + normal Drive folder URLs"
            git push
          fi
